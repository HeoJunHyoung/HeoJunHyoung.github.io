                <li>WebSocket & STOMP 기반 실시간 채팅 시스템 구현</li>
                <li>Redis Pub/Sub 도입으로 다중 서버 환경 메시지 동기화</li>
                <li>MongoDB 기반 Polyglot Persistence 적용으로 대용량 메시지 처리 최적화</li>
                <li>Handshake Interceptor로 JWT 인증 이슈 해결</li>
              </ul>
            </div>
          </div>

      - layout: top-middle
        title: Vinyl Groove (Team Project)
        description: |
          <div class="project-card">
            <div class="project-card-header">
