# About Section
about_profile_image: images/profile.png
about_content: |
  <div class="slogan-container">
    <span class="quote-mark">“</span>
      <span class="slogan-text">
      단순한 기능 구현을 넘어, 데이터와 지표로 시스템의 신뢰성을 증명하는 개발자
      </span>
    <span class="quote-mark">”</span>
  </div>

  아키텍처 설계와 성능 개선을 중심으로 견고하고 예측 가능한 백엔드 시스템을 구축해 왔으며, 기술적 선택은 항상 **비즈니스 가치와 객관적 근거**로 평가합니다.

  **지표 기반 모니터링**을 통해 병목을 식별하고, 개선 전·후 성능을 **수치로 검증**하며 문제를 해결합니다. 
  기술 도입 시에는 **운영 복잡도와 유지보수 비용을 포함한 trade-off**를 함께 고려합니다.

  단위·통합 테스트와 **부하 테스트를 통한 사전 검증**으로 장애 가능성을 최소화하는 개발을 실천합니다.

# Content Configuration 
content:
  - title: Skills
    layout: list
    content:
      - layout: left
        title: Backend
        description: |
          * Java, Python
          * Spring Boot, Spring Cloud, Spring MVC, Spring Batch, Spring Security
          * JPA (Hibernate), QueryDSL, Spring Data JPA/Redis
          * Kafka, Debezium (CDC)
      - layout: left
        title: Database
        description: |
          * MySQL, PostgreSQL
          * Redis, MongoDB
      - layout: left
        title: Infrastructure & DevOps
        description: |
          * Docker, Kubernetes (EKS, Local Cluster)
          * EC2, RDS, S3, ElastiCache, ALB, Route53
          * GitHub Actions, ArgoCD (GitOps)
      - layout: left
        title: Observability & Testing
        description: |
          * Prometheus, Grafana, Micrometer
          * k6 (Load Testing), Testcontainers, JUnit5, Mockito
          * Swagger (SpringDoc)

  - title: Projects
    layout: list
    content:
      - layout: top-middle
        title: LinkFolio (Team Project)
        sub_title: 개발자 포트폴리오 공유 및 채용 플랫폼 (MSA)
        caption: 2025.10.27 ~ 2025.12.12
        description: |
          * Kubernetes 3-Node 로컬 클러스터 직접 구축 및 운영
          * Kafka & Debezium 기반 EDA 설계로 실시간 데이터 동기화 구현
          * Transactional Outbox 기반 SAGA 패턴 적용으로 분산 트랜잭션 정합성 보장
          * Redis 기반 Split Caching 전략 도입으로 조회 성능 78% 단축 및 DB Lock 경합 해결
          * ArgoCD 기반 GitOps 파이프라인 구축으로 배포 자동화

      - layout: top-middle
        title: GotEEgo (Team Project)
        sub_title: 사용자 맞춤 여행 메이트 추천 플랫폼
        caption: 2025.07.16 ~ 2025.08.24
        description: |
          * WebSocket & STOMP 기반 실시간 채팅 시스템 구현
          * Redis Pub/Sub 도입으로 다중 서버 환경 메시지 동기화 및 수평 확장 구조 설계
          * MongoDB 기반 Polyglot Persistence 적용으로 대용량 메시지 처리 최적화
          * Handshake Interceptor를 활용한 JWT 인증 이슈 해결

      - layout: top-middle
        title: Vinyl Groove (Team Project)
        sub_title: 재즈 LP 이커머스 플랫폼
        caption: 2025.07.07 ~ 2025.07.14
        description: |
          * Redisson 분산 락 적용으로 대량 주문 시 재고 갱신 손실(Lost Update) 방지
          * Redis Sorted Set을 활용한 실시간 베스트셀러 랭킹 시스템 구축 (O(1))
          * k6 부하 테스트 기반 DB 커넥션 풀 튜닝으로 병목 구간 개선

      - layout: top-middle
        title: Secondhand-market (Personal Project)
        sub_title: 데이터 정합성 중심의 중고 거래 플랫폼
        caption: 2026.01.09 ~ 2026.01.24
        description: |
          * MySQL FullText Index 도입으로 검색 성능 55배 개선 (4.9s → 0.08s)
          * Redis 캐싱 및 Null Object Pattern 적용으로 조회 성능 3.5배 향상
          * CompletableFuture 기반 멀티스레드 이미지 업로드 속도 5배 개선

  - title: Education
