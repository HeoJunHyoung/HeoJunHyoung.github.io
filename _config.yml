about_content: |
  <div class="slogan-container">
    <span class="quote-mark">"</span>
      <span class="slogan-text">
      데이터와 지표로 시스템의 신뢰성을 증명하는 백엔드 개발자
      </span>
    <span class="quote-mark">"</span>
  </div>

  기술적 선택이 비즈니스 가치로 이어지기 위해서는 객관적인 근거가 필요하다고 믿으며, 프로젝트 전반에서 **지표 기반의 의사결정**을 중심으로 개발해 왔습니다.

  서버 백엔드 개발자로서 아키텍처 설계와 성능 문제에 관심을 가지고, **시스템이 왜 느려지고 왜 불안정해지는지**를 구조적으로 이해하려 노력하고 있습니다.
  특히 모니터링 지표를 통해 병목을 식별하고, 개선 전·후 변화를 수치로 검증하며 캐싱, 비동기 처리, 분산 환경 설계 등을 적용해 왔습니다.

  기술 선택 시에는 항상 **트레이드오프를 고려**하며, 성능뿐 아니라 유지보수성과 운영 복잡도를 함께 판단하는 설계를 지향합니다.
  테스트와 관측 가능한 시스템을 통해 예측 가능한 서비스 운영을 목표로 하고 있습니다.

  기록을 통한 성장을 중요하게 생각하여 **250여 건의 기술 포스트**를 작성하며 학습 내용을 공유해 왔고, 협업을 통해 기술로 비즈니스 문제를 해결하는 개발자로 성장하고자 합니다.

# Content Configuration 
content:
  - title: Skills
    layout: list
    content:
      - layout: left
        title: Backend
        description: |
          * Java, Python
          * Spring Boot, Spring MVC, Spring Batch, Spring Security, Spring Data JPA/Redis, Spring Cloud AWS
          * JPA, Querydsl, Hibernate
          * Kafka, Debezium (CDC)
      - layout: left
        title: Database
        description: |
          * MySQL, PostgreSQL
          * Redis, MongoDB
      - layout: left
        title: Infra & DevOps
        description: |
          * Docker, Kubernetes (EKS, Local Cluster)
          * EC2, RDS, S3, ElastiCache, ALB, Route53
          * GitHub Actions, ArgoCD (GitOps)
      - layout: left
        title: Test & Monitoring
        description: |
          * JUnit5, Mockito, Testcontainers, k6 (Load Testing)
          * Prometheus, Grafana, Micrometer
          * Swagger

  - title: Projects
    layout: list
    content:
      - layout: top-middle
        title: LinkFolio (Team Project)
        description: |
          <div class="project-card">
            <div class="project-card-header">
              <div class="project-card-title">LinkFolio (Team Project)</div>
              <div class="project-card-date">2025.10.27 ~ 2025.12.12</div>
            </div>
            <div class="project-card-content">
              개발자 포트폴리오 공유 및 채용 플랫폼 (MSA 기반)
              <ul class="project-card-list">
                <li>Kafka & Debezium 기반 Event-Driven Architecture 설계로 실시간 데이터 동기화 구현</li>
                <li>Transactional Outbox 기반 SAGA 패턴으로 분산 트랜잭션 정합성 보장</li>
                <li>Redis Split Caching 도입으로 DB Lock 경합 해결 및 응답 시간 78% 단축</li>
                <li>Kubernetes 로컬 클러스터 구축 및 ArgoCD 기반 GitOps 파이프라인 운영</li>
              </ul>
            </div>
          </div>

      - layout: top-middle
        title: GotEEgo (Team Project)
        description: |
          <div class="project-card">
            <div class="project-card-header">
