# About Section
about_profile_image: images/profile.png
about_content: |
  <div class="slogan-container">
    <span class="quote-mark">“</span>
    **단순한 기능 구현을 넘어, <mark>데이터와 지표로 시스템의 신뢰성을 증명</mark>하는 개발자**
    <span class="quote-mark">”</span>
  </div>

  어제보다 더 견고하고 예측 가능한 시스템을 만드는 것에 보람을 느끼며, 꾸준한 기록과 학습을 통해 동료들과 함께 성장하는 것을 지향합니다. 안정적인 서비스 운영을 위한 아키텍처 설계와 성능 튜닝에 깊은 관심을 가지고 있으며, 기술적 선택이 비즈니스 가치로 이어지기 위해서는 **객관적인 근거**가 뒷받침되어야 한다고 믿습니다.

  이러한 철학을 바탕으로 다음과 같은 원칙을 지키며 개발에 임합니다.

  * **지표 기반의 문제 해결:** **Prometheus와 Grafana**를 활용한 모니터링 체계를 구축하여 시스템 상태를 가시화합니다. 정의된 지표를 바탕으로 병목 지점을 파악하고, 최적화 전후의 결과를 <mark>수치로 검증</mark>하는 과정을 즐깁니다.

  * **효율적인 성능 최적화:** 무분별한 기술 도입보다는 시스템의 제약 사항을 분석하여 적재적소에 솔루션을 적용합니다. 캐싱 전략 수립, 인덱스 튜닝, 동시성 제어 등을 통해 자원을 효율적으로 사용하고 <mark>사용자 경험을 개선</mark>하는 데 집중합니다.

  * **철저한 사전 검증:** **k6 부하 테스트**를 통해 운영 환경에서 발생할 수 있는 한계점을 선제적으로 탐색합니다. 예상되는 부하와 한계치를 사전에 파악하여 안정적인 서비스 운영을 보장합니다.

