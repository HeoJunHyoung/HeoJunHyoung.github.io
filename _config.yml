# About Section
about_profile_image: images/profile.png
about_content: |
  <div class="slogan-container">
    <span class="quote-mark">“</span>
      <span class="slogan-text">
      단순한 기능 구현을 넘어, 데이터와 지표로 시스템의 신뢰성을 증명하는 개발자
      </span>
    <span class="quote-mark">”</span>
  </div>

  기술적 선택이 비즈니스 가치로 이어지기 위해서는 객관적인 근거가 필요하다고 믿으며, 프로젝트 전반에서 <mark>지표 기반의 의사결정</mark>을 지향하고 있습니다.

  서버 백엔드 개발자로서 아키텍처 설계와 성능 문제에 관심을 가지고, **시스템이 왜 느려지고 왜 불안정해지는지**를 구조적으로 이해하려 노력해 왔습니다.
  프로젝트에서는 단순한 기능 완성보다 지표를 통해 병목을 확인하고 **개선 전·후 변화를 수치로 검증**하는 과정에 집중해 왔으며, 이러한 문제의식 속에서 캐싱, 비동기 처리, 분산 환경 설계를 학습하고 적용해 왔습니다.

  또한 기술 선택 시에는 항상 **트레이드오프**를 고려하며, **성능과 유지보수성**을 함께 만족시키는 설계를 목표로 합니다.
  테스트와 모니터링을 통해 예측 가능한 개발을 지향하고, 실제 서비스 운영을 고려한 설계와 구현에 관심을 가지고 학습하고 있습니다.

  기록을 통한 성장을 중요하게 생각하여 **250여 건의 기술 포스트**를 작성하며 학습 내용을 공유해 왔습니다.
  동료들과의 능동적인 소통과 협업을 통해 기술로 비즈니스 문제 해결에 기여하는 개발자로 성장하고자 합니다.


